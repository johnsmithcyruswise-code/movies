<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0b12">
<title>Vela · stream & download</title>
<style>
  :root{
    --bg-0:#0d0b12; --bg-1:#141119; --glass:rgba(20,17,25,.62); --glass-hi:rgba(27,23,35,.85);
    --stroke:rgba(255,255,255,.07); --stroke-hi:rgba(255,255,255,.13);
    --text:#fff; --text-2:rgba(255,255,255,.68); --muted:rgba(255,255,255,.42); --dim:rgba(255,255,255,.20);
    --a1:#6366f1; --a2:#8b5cf6; --a3:#f43f5e;
    --a-grad:linear-gradient(135deg,var(--a1) 0%,var(--a2) 55%,var(--a3) 100%);
    --a-grad-soft:linear-gradient(135deg,rgba(99,102,241,.16),rgba(244,63,94,.16));
    --danger:#ff6b81;
    --radius-xl:26px; --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
    --shadow-lg:0 30px 60px -20px rgba(0,0,0,.85); --shadow-glow:0 12px 30px -8px rgba(139,92,246,.55);
    --ease-out:cubic-bezier(.2,.9,.3,1.1); --ease-soft:cubic-bezier(.4,0,.2,1);
    --pad:28px 20px 80px; --grid-min:180px; --grid-gap:22px; --title:24px;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;}
  html{-webkit-text-size-adjust:100%;}
  body{min-height:100vh;background:var(--bg-0);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;padding:var(--pad);}
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse 55% 45% at 15% 0%,rgba(99,102,241,.14),transparent 60%),radial-gradient(ellipse 45% 45% at 85% 100%,rgba(244,63,94,.10),transparent 60%),radial-gradient(circle at 20% 10%,#1a1524 0%,#0d0b12 70%);}
  body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.85;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");}
  button{font-family:inherit;} img{display:block;max-width:100%;}
  :focus-visible{outline:2px solid var(--a2);outline-offset:3px;border-radius:6px;}
  .wrap{max-width:1200px;margin:0 auto;}
  .brand{display:flex;align-items:center;gap:14px;margin-bottom:30px;animation:fadeUp .5s var(--ease-soft) both;}
  .brand-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--a-grad);box-shadow:var(--shadow-glow);animation:pulseGlow 3.4s ease-in-out infinite;}
  @keyframes pulseGlow{0%,100%{box-shadow:0 10px 26px -8px rgba(139,92,246,.6);}50%{box-shadow:0 10px 42px 0px rgba(244,63,94,.45);}}
  .brand h1{font-size:var(--title);font-weight:700;letter-spacing:-.6px;background:linear-gradient(135deg,#fff,#e9d5ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .brand .tag{margin-left:auto;font-size:11.5px;letter-spacing:.5px;color:var(--dim);font-weight:500;text-transform:uppercase;}
  .search-shell{width:100%;background:var(--glass);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--stroke);border-radius:60px;padding:6px 6px 6px 22px;display:flex;align-items:center;gap:12px;transition:border-color .25s,box-shadow .25s,background .25s;margin-bottom:14px;animation:fadeUp .5s var(--ease-soft) .05s both;}
  .search-shell:focus-within{border-color:rgba(139,92,246,.55);background:var(--glass-hi);box-shadow:0 0 0 4px rgba(139,92,246,.10),0 24px 60px -20px rgba(139,92,246,.35);}
  .search-shell svg{flex:0 0 auto;width:20px;height:20px;stroke:var(--muted);transition:stroke .2s;}
  .search-shell:focus-within svg{stroke:var(--a2);}
  .search-input{flex:1 1 auto;min-width:0;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;padding:13px 0;letter-spacing:.2px;font-weight:400;}
  .search-input::placeholder{color:var(--muted);font-weight:300;}
  .search-clear{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:none;background:rgba(255,255,255,.06);color:var(--muted);cursor:pointer;display:none;place-items:center;font-size:17px;line-height:1;transition:background .2s,color .2s;}
  .search-clear:hover{background:rgba(255,255,255,.14);color:var(--text);}
  .search-clear.visible{display:grid;}
  .search-submit{flex:0 0 auto;border:none;cursor:pointer;padding:13px 26px;border-radius:60px;font-size:14px;font-weight:600;letter-spacing:.3px;color:#fff;min-width:108px;background:var(--a-grad);box-shadow:var(--shadow-glow);transition:transform .15s var(--ease-soft),box-shadow .2s,opacity .2s,filter .2s;}
  .search-submit:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 14px 34px -8px rgba(139,92,246,.7);}
  .search-submit:active{transform:translateY(0);}
  .search-submit:disabled{opacity:.55;cursor:not-allowed;transform:none;filter:none;}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 28px;animation:fadeUp .5s var(--ease-soft) .1s both;}
  .chip{font-size:12px;font-weight:500;letter-spacing:.3px;padding:8px 15px;border-radius:40px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.6);transition:all .22s var(--ease-soft);}
  .chip:hover{color:var(--text);border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.10);transform:translateY(-1px);}
  .chip.active{color:#fff;border-color:transparent;background:var(--a-grad);box-shadow:0 6px 18px -6px rgba(139,92,246,.6);}
  .status{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);font-weight:300;letter-spacing:.2px;min-height:18px;margin-bottom:22px;animation:fadeUp .5s var(--ease-soft) .15s both;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--a2);box-shadow:0 0 10px var(--a2);flex:0 0 auto;animation:blink 1.8s infinite;}
  .dot.loading{background:var(--a3);box-shadow:0 0 12px var(--a3);}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
  .section-title{font-size:13px;font-weight:600;letter-spacing:.5px;color:var(--muted);text-transform:uppercase;margin:8px 0 18px;display:flex;align-items:center;gap:12px;}
  .section-title::after{content:"";flex:1 1 auto;height:1px;background:rgba(255,255,255,.06);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--grid-min),1fr));gap:var(--grid-gap);}
  .card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .35s var(--ease-out),border-color .3s,box-shadow .4s,background .3s;animation:cardEnter .55s var(--ease-out) backwards;position:relative;}
  @keyframes cardEnter{from{opacity:0;transform:translateY(16px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
  .card:hover{transform:translateY(-6px) scale(1.02);border-color:rgba(139,92,246,.4);background:rgba(255,255,255,.05);box-shadow:0 28px 44px -22px rgba(139,92,246,.45);}
  .poster{aspect-ratio:2/3;position:relative;overflow:hidden;background:linear-gradient(145deg,#1e1a2b,#0f0c15);display:grid;place-items:center;color:var(--dim);font-size:42px;font-weight:700;}
  .poster img{width:100%;height:100%;object-fit:cover;transition:transform .5s var(--ease-soft);}
  .card:hover .poster img{transform:scale(1.06);}
  .poster::after{content:"▶";position:absolute;font-size:30px;color:#fff;opacity:0;transform:scale(.7);transition:opacity .25s,transform .25s;text-shadow:0 3px 14px rgba(0,0,0,.9);pointer-events:none;}
  .card:hover .poster::after{opacity:1;transform:scale(1);}
  .card-body{padding:13px 15px 15px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .title{font-size:13.5px;font-weight:500;color:rgba(255,255,255,.92);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .meta{font-size:11px;color:var(--dim);display:flex;gap:6px;margin-top:2px;font-weight:400;}
  .skel{border-radius:var(--radius-lg);overflow:hidden;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);}
  .skel-poster{aspect-ratio:2/3;background:linear-gradient(100deg,#181421 20%,#211b2d 40%,#181421 60%);background-size:300% 100%;animation:shimmer 1.4s infinite;}
  .skel-body{padding:13px 15px 18px;}
  .skel-line{height:10px;border-radius:4px;margin-bottom:8px;background:linear-gradient(100deg,#181421 20%,#211b2d 40%,#181421 60%);background-size:300% 100%;animation:shimmer 1.4s infinite;}
  .skel-line.short{width:60%;}
  @keyframes shimmer{0%{background-position:100% 0;}100%{background-position:-100% 0;}}
  .empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--dim);font-size:14px;letter-spacing:.3px;line-height:1.7;}
  .empty .emoji{font-size:44px;display:block;margin-bottom:16px;opacity:.7;}
  .empty strong{color:var(--text-2);font-weight:500;display:block;margin-bottom:8px;font-size:15px;}
  .modal{position:fixed;inset:0;background:rgba(6,5,10,.85);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .3s var(--ease-soft);z-index:100;}
  .modal.open{opacity:1;pointer-events:all;}
  .modal-box{width:100%;max-width:880px;background:var(--bg-1);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius-xl);transform:scale(.94) translateY(10px);transition:transform .35s var(--ease-out);box-shadow:var(--shadow-lg);margin:auto;overflow:hidden;}
  .modal.open .modal-box{transform:scale(1) translateY(0);}
  .modal-head{display:flex;gap:18px;padding:24px 26px 18px;align-items:flex-start;border-bottom:1px solid rgba(255,255,255,.06);position:relative;}
  .modal-head .m-info{flex:1 1 auto;min-width:0;}
  .modal-head h2{font-size:19px;font-weight:600;line-height:1.3;margin-bottom:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .modal-head p{font-size:12.5px;color:var(--muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .btn-close{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.6);cursor:pointer;font-size:17px;line-height:1;display:grid;place-items:center;transition:background .2s,color .2s,transform .2s;}
  .btn-close:hover{background:rgba(255,255,255,.14);color:var(--text);transform:rotate(90deg);}
  .player-wrap{margin:20px 26px 0;border-radius:var(--radius-lg);overflow:hidden;background:#050408;border:1px solid rgba(255,255,255,.06);position:relative;aspect-ratio:16/9;display:grid;place-items:center;}
  .player-wrap audio{width:100%;padding:26px;aspect-ratio:auto;}
  .player-wrap video{width:100%;height:100%;object-fit:contain;background:#050408;display:block;}
  .player-fallback{padding:40px 24px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7;max-width:460px;}
  .player-fallback .emoji{font-size:36px;display:block;margin-bottom:10px;opacity:.6;}
  .player-fallback strong{display:block;color:var(--text-2);font-weight:500;font-size:14px;margin-bottom:6px;}
  .source-bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 26px 0;}
  .source-pill{font-size:11.5px;font-weight:500;letter-spacing:.3px;padding:8px 14px;border-radius:40px;cursor:pointer;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);color:var(--muted);transition:all .22s var(--ease-soft);white-space:nowrap;}
  .source-pill:hover{color:var(--text);border-color:rgba(139,92,246,.4);}
  .source-pill.active{color:#fff;border-color:transparent;background:var(--a-grad);box-shadow:0 6px 16px -6px rgba(139,92,246,.55);}
  .modal-body{padding:22px 26px 28px;}
  .modal-body h3{font-size:11.5px;font-weight:600;letter-spacing:.7px;color:var(--muted);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
  .modal-body h3::after{content:"";flex:1 1 auto;height:1px;background:rgba(255,255,255,.06);}
  .files{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto;padding-right:4px;}
  .files::-webkit-scrollbar{width:6px;}
  .files::-webkit-scrollbar-track{background:transparent;}
  .files::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px;}
  .file-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:var(--radius-sm);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);transition:all .2s var(--ease-soft);}
  .file-row:hover{background:rgba(255,255,255,.06);border-color:rgba(139,92,246,.3);}
  .file-ext{flex:0 0 auto;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.4px;background:linear-gradient(145deg,#1e1a2b,#0f0c15);color:#c4b5fd;}
  .file-info{flex:1 1 auto;min-width:0;}
  .file-name{font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
  .file-size{font-size:11px;color:var(--dim);}
  .file-actions{flex:0 0 auto;display:flex;gap:6px;}
  .file-btn{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);color:var(--muted);padding:8px 14px;border-radius:40px;font-size:11.5px;font-weight:500;cursor:pointer;text-decoration:none;transition:all .2s var(--ease-soft);display:inline-flex;align-items:center;gap:5px;font-family:inherit;}
  .file-btn:hover{color:var(--text);border-color:rgba(255,255,255,.2);transform:translateY(-1px);}
  .file-btn.primary{background:rgba(244,63,94,.14);color:#fda4af;border-color:rgba(244,63,94,.3);}
  .file-btn.primary:hover{background:rgba(244,63,94,.24);color:#fff;box-shadow:0 6px 14px -6px rgba(244,63,94,.6);}
  .file-btn.active-play{background:rgba(139,92,246,.18);color:#ddd6fe;border-color:rgba(139,92,246,.4);}
  .hint{font-size:12px;color:var(--dim);padding:16px 0 2px;line-height:1.7;}
  .toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none;width:max-content;max-width:calc(100% - 40px);}
  .toast{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--glass-hi);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--stroke-hi);border-radius:14px;font-size:13px;color:var(--text);box-shadow:0 20px 40px -12px rgba(0,0,0,.7);animation:toastIn .4s var(--ease-out) both;}
  .toast.out{animation:toastOut .3s var(--ease-soft) forwards;}
  .toast .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex:0 0 auto;background:var(--a-grad-soft);color:#c4b5fd;}
  .toast.error .ic{background:rgba(255,107,129,.15);color:var(--danger);}
  @keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
  @keyframes toastOut{to{opacity:0;transform:translateY(12px) scale(.96);}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @media (min-width:1100px){:root{--pad:40px 40px 100px;--grid-min:200px;--grid-gap:24px;--title:26px;}.wrap{max-width:1320px;}.brand{margin-bottom:36px;}}
  @media (min-width:640px) and (max-width:1099px){:root{--pad:28px 28px 80px;--grid-min:220px;--grid-gap:20px;--title:24px;}.wrap{max-width:960px;}.modal-box{max-width:760px;}}
  @media (max-width:639px){:root{--pad:20px 14px calc(96px + env(safe-area-inset-bottom,0px));--grid-min:140px;--grid-gap:12px;--title:20px;}.brand{margin-bottom:20px;}.brand .tag{display:none;}
    .search-shell{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:80;padding:6px 6px 6px 16px;box-shadow:0 24px 60px -12px rgba(0,0,0,.8),0 8px 24px -8px rgba(139,92,246,.5);margin:0;}
    .search-submit{padding:12px 18px;min-width:0;font-size:13px;}.search-input{font-size:16px;padding:12px 0;}
    .chips{flex-wrap:nowrap;overflow-x:auto;margin-bottom:22px;padding-bottom:4px;-webkit-overflow-scrolling:touch;}.chips::-webkit-scrollbar{display:none;}.chip{flex:0 0 auto;}
    .card-body{padding:10px 12px 12px;}.title{font-size:12.5px;}.meta{font-size:10.5px;}
    .modal{padding:0;align-items:stretch;}.modal-box{border-radius:0;max-width:100%;min-height:100vh;border:none;}
    .modal-head{padding:18px 16px 14px;}.modal-head h2{font-size:16px;}
    .player-wrap{margin:14px 16px 0;border-radius:var(--radius-md);}
    .source-bar{margin:12px 16px 0;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}.source-bar::-webkit-scrollbar{display:none;}.source-pill{flex:0 0 auto;}
    .modal-body{padding:16px 16px 24px;}.file-row{padding:10px 12px;gap:10px;flex-wrap:wrap;}.file-ext{width:38px;height:38px;font-size:10px;}.file-actions{width:100%;justify-content:flex-end;}
    .toasts{bottom:calc(90px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 24px);}}
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important;animation-iteration-count:1 !important;}}
</style>
</head>
<body>

<div class="wrap">
  <header class="brand">
    <div class="brand-icon" aria-hidden="true">🎬</div>
    <h1>Vela</h1>
    <span class="tag">stream · download · public domain</span>
  </header>

  <form class="search-shell" id="searchForm" role="search" autocomplete="off" aria-label="Movie search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
    </svg>
    <input type="text" class="search-input" id="searchInput" placeholder="Search films, actors, decades, anything…" aria-label="Search movies" spellcheck="false">
    <button type="button" class="search-clear" id="searchClear" aria-label="Clear search">&times;</button>
    <button type="submit" class="search-submit" id="searchSubmit">Search</button>
  </form>

  <nav class="chips" id="chips" aria-label="Quick searches">
    <button type="button" class="chip" data-q="nosferatu">Nosferatu</button>
    <button type="button" class="chip" data-q="metropolis">Metropolis</button>
    <button type="button" class="chip" data-q="chaplin">Chaplin</button>
    <button type="button" class="chip" data-q="buster keaton">Buster Keaton</button>
    <button type="button" class="chip" data-q="horror">Horror</button>
    <button type="button" class="chip" data-q="cartoon">Cartoons</button>
    <button type="button" class="chip" data-q="western">Westerns</button>
  </nav>

  <div class="status" role="status" aria-live="polite">
    <span class="dot" id="statusDot" aria-hidden="true"></span>
    <span id="statusText">ready · search to begin</span>
  </div>

  <section id="resultsSection" hidden>
    <div class="section-title" id="resultsTitle">Results</div>
    <main class="grid" id="grid" aria-live="polite"></main>
  </section>

  <section id="recommendSection">
    <div class="section-title">Popular now</div>
    <div class="grid" id="recommendGrid"></div>
  </section>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle" aria-hidden="true">
  <div class="modal-box">
    <div class="modal-head">
      <div class="m-info">
        <h2 id="mTitle">—</h2>
        <p id="mDesc">—</p>
      </div>
      <button type="button" class="btn-close" id="mClose" aria-label="Close dialog">&times;</button>
    </div>
    <div class="player-wrap" id="playerWrap" aria-label="Media player"></div>
    <div class="source-bar" id="sourceBar" aria-label="Source quality"></div>
    <div class="modal-body">
      <h3>All files — pick any to stream or download</h3>
      <div class="files" id="mFiles"></div>
      <p class="hint">You decide: tap <strong>Stream</strong> on any file to play it here, or <strong>Download</strong> to save it.</p>
    </div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
  "use strict";

  var form=document.getElementById("searchForm"),input=document.getElementById("searchInput"),
      clearBtn=document.getElementById("searchClear"),submit=document.getElementById("searchSubmit"),
      statusDot=document.getElementById("statusDot"),statusTx=document.getElementById("statusText"),
      grid=document.getElementById("grid"),resultsSection=document.getElementById("resultsSection"),
      resultsTitle=document.getElementById("resultsTitle"),recommendSection=document.getElementById("recommendSection"),
      recommendGrid=document.getElementById("recommendGrid"),chips=document.getElementById("chips"),
      modal=document.getElementById("modal"),mClose=document.getElementById("mClose"),
      mTitle=document.getElementById("mTitle"),mDesc=document.getElementById("mDesc"),
      playerWrap=document.getElementById("playerWrap"),sourceBar=document.getElementById("sourceBar"),
      mFiles=document.getElementById("mFiles"),toasts=document.getElementById("toasts");

  var activeChip=null,currentIndex=-1,lastFocused=null,requestSeq=0;

  function setStatus(t,l){statusTx.textContent=t;statusDot.classList.toggle("loading",!!l);}
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function fmtBytes(n){if(!n||n<1024)return(n||0)+" B";var u=["KB","MB","GB"],i=-1;do{n/=1024;i++;}while(n>=1024&&i<u.length-1);return n.toFixed(n<10?1:0)+" "+u[i];}
  function thumbUrl(id){return"https://archive.org/services/img/"+encodeURIComponent(id);}
  function isVideo(n){return/\.(mp4|m4v|ogv|webm|avi|mov|mkv)$/i.test(n);}
  function isAudio(n){return/\.(mp3|ogg|oga|flac|wav|m4a|aac|opus)$/i.test(n);}
  function toast(msg,type){type=type||"info";var el=document.createElement("div");el.className="toast"+(type==="error"?" error":"");
    el.innerHTML='<span class="ic" aria-hidden="true">'+(type==="error"?"✕":"✓")+'</span><span>'+esc(msg)+'</span>';
    toasts.appendChild(el);setTimeout(function(){el.classList.add("out");setTimeout(function(){el.remove();},320);},2800);}

  function showSkeletons(target,count){target.innerHTML="";for(var i=0;i<(count||8);i++){var s=document.createElement("div");s.className="skel";
    s.innerHTML='<div class="skel-poster"></div><div class="skel-body"><div class="skel-line"></div><div class="skel-line short"></div></div>';target.appendChild(s);}}

  /* ================================================================
     THE SEARCH — verified endpoint + forgiving fallback ladder
     ================================================================ */
  function buildUrl(q){
    return "https://archive.org/advancedsearch.php?q=" + encodeURIComponent(q) +
      "&fl[]=identifier&fl[]=title&fl[]=year&fl[]=description&fl[]=downloads" +
      "&rows=40&page=1&output=json";
  }

  function fetchDocs(q){
    return fetch(buildUrl(q)).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(data){
      var docs = (data && data.response && data.response.docs) || [];
      return docs.filter(function(d){ return d && d.identifier; });
    });
  }

  function search(query){
    query = String(query || "").trim();
    if(!query){ input.focus(); return; }

    var mySeq = ++requestSeq;
    submit.disabled = true;
    setStatus('searching for "' + query + '"…', true);
    resultsSection.hidden = false;
    resultsTitle.textContent = 'Results for "' + query + '"';
    showSkeletons(grid, 10);

    // Progressive fallback ladder — this is what makes "anything" work.
    // 1. raw term (Archive's own search box behaviour)
    // 2. title:(term)  — catches exact-title searches
    // 3. first word only — catches long queries
    // 4. mediatype:(movies) term — narrower but often hits
    fetchDocs(query).then(function(d1){
      if(mySeq !== requestSeq) return null;
      if(d1.length) return d1;

      // Step 2: title match
      return fetchDocs("title:(" + query + ")").then(function(d2){
        if(mySeq !== requestSeq) return null;
        if(d2.length) return d2;

        // Step 3: first meaningful word
        var firstWord = query.split(/\s+/).filter(function(w){ return w.length > 1; })[0] || query;
        return fetchDocs(firstWord).then(function(d3){
          if(mySeq !== requestSeq) return null;
          if(d3.length) return d3;

          // Step 4: mediatype movies
          return fetchDocs("(" + query + ") AND mediatype:(movies)").then(function(d4){
            return d4;
          });
        });
      });
    }).then(function(docs){
      if(mySeq !== requestSeq) return;
      if(!docs) return; // superseded

      renderResults(grid, docs, query);
      if(docs.length){
        setStatus(docs.length + ' result' + (docs.length > 1 ? 's' : '') + ' for "' + query + '"');
        toast(docs.length + ' result' + (docs.length > 1 ? 's' : '') + ' found');
        recommendSection.hidden = true;
      } else {
        setStatus('no results for "' + query + '"');
      }
    }).catch(function(err){
      if(mySeq !== requestSeq) return;
      console.error(err);
      grid.innerHTML = '<div class="empty"><span class="emoji">⚠️</span><strong>Search failed: ' + esc(err.message) + '</strong>Check your connection and try again.</div>';
      setStatus('search failed: ' + err.message);
      toast('Search failed: ' + err.message, 'error');
    }).finally(function(){
      if(mySeq === requestSeq) submit.disabled = false;
    });
  }

  function renderResults(target, docs, query){
    target.innerHTML = "";
    if(!docs.length){
      target.innerHTML = '<div class="empty"><span class="emoji">🔍</span><strong>No results</strong>Nothing found for "' + esc(query) + '". Try fewer words or a different spelling.</div>';
      return;
    }
    docs.forEach(function(doc, i){ target.appendChild(makeCard(doc, i)); });
  }

  function makeCard(doc, i){
    var card = document.createElement("div");
    card.className = "card";
    card.style.animationDelay = (i * 0.03) + "s";
    card.tabIndex = 0;
    card.setAttribute("role", "button");

    var title = Array.isArray(doc.title) ? doc.title[0] : (doc.title || doc.identifier);
    var year  = doc.year || "";
    var desc  = Array.isArray(doc.description) ? doc.description[0] : (doc.description || "");
    card.setAttribute("aria-label", "Open " + title);

    card.innerHTML =
      '<div class="poster"><img loading="lazy" src="' + thumbUrl(doc.identifier) + '" alt="' + esc(title) + '" ' +
        'onerror="this.style.display=\'none\';this.parentElement.textContent=\'🎬\'"></div>' +
      '<div class="card-body"><div class="title">' + esc(title) + '</div>' +
      '<div class="meta">' + (year ? '<span>' + esc(year) + '</span><span>·</span>' : '') +
      '<span>' + (doc.downloads ? doc.downloads.toLocaleString() + ' dl' : 'film') + '</span></div></div>';

    function open(){ openDetails(doc, title, desc, card); }
    card.addEventListener("click", open);
    card.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); open(); }
    });
    return card;
  }

  function loadRecommendations(){
    showSkeletons(recommendGrid, 8);
    fetchDocs("feature_films OR silent_films OR animationandcartoons").then(function(docs){
      recommendGrid.innerHTML = "";
      if(!docs.length){
        recommendGrid.innerHTML = '<div class="empty"><span class="emoji">🎞️</span>Recommendations unavailable right now.</div>';
        return;
      }
      docs.slice(0, 12).forEach(function(doc, i){ recommendGrid.appendChild(makeCard(doc, i)); });
    }).catch(function(){
      recommendGrid.innerHTML = '<div class="empty"><span class="emoji">🎞️</span>Recommendations unavailable right now.</div>';
    });
  }

  function openDetails(doc, title, desc, openerEl){
    lastFocused = openerEl || document.activeElement;
    mTitle.textContent = title;
    mDesc.textContent = desc || "Public-domain film from the Internet Archive.";
    playerWrap.innerHTML = '<div class="player-fallback"><span class="emoji">🎛️</span><strong>You choose what to watch</strong>Pick any file below to stream it here — or download it.</div>';
    sourceBar.innerHTML = "";
    mFiles.innerHTML = '<div style="color:var(--dim);font-size:12px;">Loading files…</div>';
    currentIndex = -1;

    modal.classList.add("open");
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    setTimeout(function(){ mClose.focus(); }, 50);

    fetch("https://archive.org/metadata/" + encodeURIComponent(doc.identifier))
      .then(function(r){ if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(meta){
        var files = (meta && meta.files) || [];
        var media = files.filter(function(f){ return f.name && (isVideo(f.name) || isAudio(f.name)); });
        media.sort(function(a,b){
          var av = isVideo(a.name) ? 0 : 1, bv = isVideo(b.name) ? 0 : 1;
          if(av !== bv) return av - bv;
          return (Number(b.size) || 0) - (Number(a.size) || 0);
        });
        if(!media.length){
          playerWrap.innerHTML = '<div class="player-fallback"><span class="emoji">📁</span>No playable or downloadable files found for this item.</div>';
          mFiles.innerHTML = '<div style="color:var(--dim);font-size:12px;">No files available.</div>';
          return;
        }
        var sources = media.map(function(f){
          var base = "https://archive.org/download/" + encodeURIComponent(doc.identifier) + "/" + encodeURIComponent(f.name);
          return { name: f.name, size: Number(f.size) || 0, video: isVideo(f.name), audio: isAudio(f.name), url: base, downloadUrl: base };
        });
        buildSourceBar(sources);
        renderFiles(sources);
      })
      .catch(function(err){
        console.error(err);
        playerWrap.innerHTML = '<div class="player-fallback"><span class="emoji">⚠️</span>Could not load files for this item.</div>';
        mFiles.innerHTML = '<div style="color:var(--dim);font-size:12px;">Could not load files.</div>';
        toast("Could not load this item", "error");
      });
  }

  function buildSourceBar(srcs){
    sourceBar.innerHTML = "";
    srcs.slice(0, 8).forEach(function(s, i){
      var ext = (s.name.split(".").pop() || "").toLowerCase();
      var label = ext.toUpperCase();
      if(s.size) label += " · " + fmtBytes(s.size);
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "source-pill";
      btn.textContent = label;
      btn.addEventListener("click", function(){ selectSource(srcs, i); });
      sourceBar.appendChild(btn);
    });
  }

  function selectSource(srcs, idx){
    currentIndex = idx;
    var pills = sourceBar.querySelectorAll(".source-pill");
    pills.forEach(function(b, bi){ b.classList.toggle("active", bi === idx); });
    var rows = mFiles.querySelectorAll(".file-row");
    rows.forEach(function(r, ri){
      var pb = r.querySelector(".play-btn");
      if(pb) pb.classList.toggle("active-play", ri === idx);
    });
    loadPlayer(srcs[idx]);
  }

  function loadPlayer(s){
    playerWrap.innerHTML = "";
    if(!s){ playerWrap.innerHTML = '<div class="player-fallback"><span class="emoji">▶️</span>No source selected.</div>'; return; }
    if(s.video){
      var v = document.createElement("video");
      v.controls = true; v.autoplay = true; v.playsInline = true; v.preload = "metadata"; v.src = s.url;
      v.addEventListener("error", function(){
        playerWrap.innerHTML = '<div class="player-fallback"><span class="emoji">🎞️</span>This format can\'t play in your browser.<br>Try another source, or download below.</div>';
        toast("That format can't be streamed here — try another", "error");
      });
      playerWrap.appendChild(v);
    } else if(s.audio){
      var a = document.createElement("audio");
      a.controls = true; a.autoplay = true; a.preload = "metadata"; a.src = s.url;
      a.addEventListener("error", function(){
        playerWrap.innerHTML = '<div class="player-fallback"><span class="emoji">🎵</span>Could not play this audio file. Try another source or download it below.</div>';
        toast("Audio failed to play — try another source", "error");
      });
      playerWrap.appendChild(a);
    } else {
      playerWrap.innerHTML = '<div class="player-fallback"><span class="emoji">📦</span>This file can\'t be streamed. Download it below.</div>';
    }
  }

  function renderFiles(srcs){
    mFiles.innerHTML = "";
    srcs.slice(0, 40).forEach(function(s, i){
      var ext = (s.name.split(".").pop() || "").toUpperCase().slice(0, 4);
      var row = document.createElement("div");
      row.className = "file-row";
      row.innerHTML =
        '<div class="file-ext">' + esc(ext) + '</div>' +
        '<div class="file-info"><div class="file-name">' + esc(s.name) + '</div>' +
        '<div class="file-size">' + esc(fmtBytes(s.size)) + '</div></div>' +
        '<div class="file-actions">' +
          '<button type="button" class="file-btn play-btn">Stream</button>' +
          '<a class="file-btn primary" href="' + s.downloadUrl + '" target="_blank" rel="noopener" download>Download</a>' +
        '</div>';
      row.querySelector(".play-btn").addEventListener("click", function(){
        selectSource(srcs, i);
        playerWrap.scrollIntoView({ behavior: "smooth", block: "center" });
      });
      mFiles.appendChild(row);
    });
  }

  function closeModal(){
    playerWrap.querySelectorAll("video,audio").forEach(function(m){
      try { m.pause(); m.removeAttribute("src"); m.load(); } catch(e){}
    });
    modal.classList.remove("open");
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    if(lastFocused && typeof lastFocused.focus === "function") lastFocused.focus();
  }
  mClose.addEventListener("click", closeModal);
  modal.addEventListener("click", function(e){ if(e.target === modal) closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape" && modal.classList.contains("open")) closeModal(); });

  function syncClear(){ clearBtn.classList.toggle("visible", input.value.length > 0); }
  input.addEventListener("input", syncClear);
  clearBtn.addEventListener("click", function(){
    input.value = ""; syncClear(); input.focus();
    setStatus("ready · search to begin");
    resultsSection.hidden = true;
    recommendSection.hidden = false;
  });

  form.addEventListener("submit", function(e){
    e.preventDefault();
    clearActiveChip();
    search(input.value);
  });

  function clearActiveChip(){ if(activeChip){ activeChip.classList.remove("active"); activeChip = null; } }
  chips.addEventListener("click", function(e){
    var btn = e.target.closest(".chip");
    if(!btn) return;
    clearActiveChip();
    btn.classList.add("active");
    activeChip = btn;
    input.value = btn.dataset.q;
    syncClear();
    search(btn.dataset.q);
  });

  syncClear();
  loadRecommendations();
})();
</script>
</body>
</html>
